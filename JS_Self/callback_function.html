<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- callback function means ek function ne bija function ma as a argument tarike pass karvama ave tene callback function kehvama ave chhe -->
     <script>
        
        let a=(a,b,add)=>{
            return add(a,b)
        }
        let add=(m,n)=> m+n

        document.write('<br>'+a(10,20,add))
        
     </script>
</body>
