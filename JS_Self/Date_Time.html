<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // date type is object

        var a=new Date()
        document.write('<br>'+a.toString())
        document.write('<br>'+a.toDateString())
        document.write('<br>'+a.toISOString())
        document.write('<br>'+a.toJSON())
        document.write('<br>'+a.toLocaleDateString())
        document.write('<br>'+typeof a)
        document.write('<br>'+new Date(2024,2,23,5,40).toLocaleString())
        // month 0 thi start thase
        document.write('<br>'+new Date("10-06-2002").toLocaleString())
        
        
        document.write('<br>'+(35/3).toFixed(0))

    </script>
</body>
</html>
