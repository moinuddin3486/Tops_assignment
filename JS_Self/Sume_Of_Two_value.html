
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        input{
            height: 40px;
            width: 150px;
            border: 2px solid red;
            box-shadow: 2px 0px 10px mediumslateblue;
            /* background-color: antiquewhite; */
            font-size: 20px;
        }
        button{
            height: 40px;
            width: 50px;
            border: 2px solid red;
            box-shadow: 2px 0px 10px mediumslateblue;
            
            
        }

<body>
    <form action="#">
    <input id="main-1" type="number" name="main-1" placeholder="Enter Value Of A"><br><br>
    <input id="main-2" type="number" name="main2" placeholder="Enter Value Of B"><br><br>
    <input id="main-3" type="number" name="main-3" readonly placeholder="Ans"><br><br>
    <button type="button" onclick="add()">ADD</button>
    <button type="button" onclick="clean()">AC</button>

</form>
<script>
    function add()
    {
        var a=Number(document.getElementById("main-1").value)
        var b=Number(document.getElementById("main-2").value)
        // var a=document.getElementById("main-1").value
        // var b=document.getElementById("main-2").value

        var c=a+b
        // document.write('<br>'+c)
        document.getElementById("main-3").value=c

    }
    function clean()
    {
        document.getElementById("main-1").value=""
        document.getElementById("main-2").value=""
        document.getElementById("main-3").value=""    
        
    }
    
</script>
    
</body>
