<body>
    <script>
        // ===========Numbers======================
        var a=23423
        document.write('<br>'+a.length)
        document.write('<br>'+typeof a)
        b=a.toString().length
        document.write('<br>'+b)
        a=100+233.33
        document.write('<br>'+a.toFixed(2))
        a=12.78
        document.write('<br>'+a.toPrecision(2)) // 12 ne j consider karse khali and pachhl nu point add karse
        a=1000000000
        document.write('<br>'+a.toLocaleString("en-IN"))

        // =============================Math Object ============= 
        a=Math.abs(-4)
        document.write('<br>'+a)
        document.write('<br>Round Of Value Is =='+Math.round(2.77)) // check for point behind
        
        document.write('<br>max Value =='+Math.max(4,7,2,9,5,22))
        document.write('<br>Min Value is=='+Math.min(4,7,2,9,5,22))
        // document.write('<br>'+((Math.random())*1000).toFixed(0)) // not fully Understand
        document.write('<br>'+(Math.random()*20).toFixed(0))
        
        
    </script>
