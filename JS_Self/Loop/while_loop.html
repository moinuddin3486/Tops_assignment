<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // while loop is called Entry COntrol loop
        let a=1
        while(a<=10){
            document.write('<br>'+a)
            a++
        }
        document.write('<br>========================')
        a=10
        while(a>=1){
            document.write('<br>'+a)
            a--
        }
        document.write('<br>====================')
        document.write('<br>Even Numbers')

        a=2
        while(a<20){
            document.write('<br>'+a)
            a+=2
        }
        document.write('<br>=====================')
        document.write('<br>Odd Numbers')
        a=1
        while(a<20){
            document.write('<br>'+a)
            a+=2
        }
    </script>
</body>
</html>
