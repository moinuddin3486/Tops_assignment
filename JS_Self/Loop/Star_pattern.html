<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         for(let i=1;i<=10;i++){
            document.write('<br>')
            for(x=1;x<=i;x++){
                document.write("*")
            }
        }

        document.write('<br>===================')
        for(let i=1;i<=10;i++){
            document.write('<br>')
            for(x=10;x>=i;x--){
                document.write("*")
            }
        }
    </script>
</body>
</html>
