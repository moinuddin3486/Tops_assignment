<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
         for(let i=1;i<=5;i++){
            document.write('<br>')
            for(x=1;x<=i;x++){
                document.write("* ")
            }
        }

        document.write('<br>===================')
        for(let i=1;i<=5;i++){
            document.write('<br>')
            for(x=5;x>=i;x--){
                document.write("* ")
            }
        }
        document.write('<br>================================')
        for (let i = 1; i <= 5; i++) {
            document.write('<br>')
            for (let j = 1; j <= 5; j++) {
                if (j >= 6 - i) {
                    // if(j+i>=6){
                    document.write('* ')
                } else {
                    document.write('&nbsp;&nbsp;&nbsp')
                }
            }
        }
        document.write('<br>===================')
        for (let i = 1; i <= 5; i++) {
            document.write('<br>')
            for (let j = 1; j <= 5; j++) {
                if (j>=i) {
                    document.write('* ')
                } else {
                    document.write('&nbsp;&nbsp;&nbsp')
                }
            }
        }
        document.write('<br>==================')

        for (let i = 1; i <= 5; i++) {
            document.write('<br>')
            for (let j = 1; j <= 9; j++) {
                if (j >= 6 - i && j <= 4 + i) {
                    document.write('* ')
                } else {
                    document.write('&nbsp;&nbsp;&nbsp')
                }
            }
        }
        document.write('<br>===========================')
        for (let i = 1; i <= 5; i++) {
            document.write('<br>')
            for (let j = 1; j <= 9; j++) {
                if (j>=i && j<=10-i) {
                    document.write('* ')
                } else {
                    document.write('&nbsp;&nbsp;&nbsp')
                }
            }
        }
        document.write('<br>==========================')
        

        
    </script>
</body>

</html>
