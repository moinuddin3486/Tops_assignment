<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // print more repeated value from the array
        let count=0
        let max =0
        let final_value=0
        let a=[2,2,1,1,1,2,2]
        for (const i of a) {
            for (let m = 0; m < a.length; m++) {
                if (i==a[m]){
                    count+=1
                }
                if(count>max){
                max=count
                final_value=i
            }
            }  
        }
        document.write('<br>Number Of time repeated Value is : '+final_value)
    </script>
</body>
</html>
