<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=new Promise((resolve,reject)=>{
            let error=true
            if(error){
                resolve("Error mali chhe")
            }
            else{
                reject("error nathi mali.. ")
            }

        })
        .then((msg)=>{
            document.write('<br> then msg'+msg)
            console.log(msg);
            
        })
        .catch((msg)=>{
            document.write('<br>'+msg)
        })
        .finally(()=>{
            document.write('<br>finalyy')
        })
    </script>
</body>
</html>
