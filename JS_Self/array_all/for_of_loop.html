<body>
    <script>
        //forof loop e array print larva mate use thay chhe 
        // ema apde start and end point apvo padto nathi 
        // te potana jate deside kare chhe 
        let arr = [1, 2, 3, 4, "Moin", "Momin"]
        for (const i of arr) {
            document.write('<br>' + i)

        }

        let str = "Moinuddin momin"
        for (const i of str) {
            if (i == " ") {
                continue
            }
            document.write('<br>' + i)

        }
        let s="Suhana Momin"
        for(i of s){
           if(i==" "){
            continue
           } 
           document.write('<br>'+i)

        }
    </script>
