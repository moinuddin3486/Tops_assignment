<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <select name="ord" id="ord">
        <option value="">----select order----</option>
        <option value="asc" onchange="asd()">ascending</option>
        <option value="dsc" >descending</option>
    </select>
    <br><br>
    <button onclick="asd()">ascending</button>
    <button onclick="dsd()">descending</button>
    <button onclick="ref()">Ref</button>
    <br><br><br>
    <table border="4" cellpadding="9px" cellspacing="2px" >
        <thead></thead>
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Age</th>

        </tr>
        <tbody id="Data" ></tbody>
    </table>
    
    <script>
        let a=[{id:101,
            name:"ABC",
            age:44},
            {id:102,
            name:"MNL",
            age:12},
            {id:103,
            name:"XYZ",
            age:48},
            {id:104,
            name:"PQL",
            age:55},
            {id:105,
            name:"IPL",
            age:44},
            {id:106,
            name:"L&T",
            age:65},
            {id:107,
            name:"QRP",
            age:89},
            {id:108,
            name:"SQL",
            age:22},
            {id:109,
            name:"KHJ",
            age:76},
            {id:110,
            name:"ASD",
            age:63},
        ]
        let all_data=""
        function asd(){
             all_data=""
            for (let key of a.sort((a,b)=> b.age-a.age)) {
            all_data+=`<tr>
                <td>${key.id}</td>
                <td>${key.name}</td>
                <td>${key.age}</td>
                </tr>`    
        }
        document.getElementById("Data").innerHTML=all_data
        }
        function dsd(){
             all_data=""
            for (let key of a.sort((a,b)=> a.age-b.age)) {
            all_data+=`<tr>
                <td>${key.id}</td>
                <td>${key.name}</td>
                <td>${key.age}</td>
                </tr>`    
        }
            document.getElementById("Data").innerHTML=all_data
        }
        function ref(){
             all_data=""
            for (let key of a.sort((a,b)=> a.id-b.id)) {
            all_data+=`<tr>
                <td>${key.id}</td>
                <td>${key.name}</td>
                <td>${key.age}</td>
                </tr>`    
        }
            document.getElementById("Data").innerHTML=all_data
        }
            for (let key of a) {
            all_data+=`<tr>
                <td>${key.id}</td>
                <td>${key.name}</td>
                <td>${key.age}</td>
                </tr>`   
            } 
            document.getElementById("Data").innerHTML=all_data
       
        
    </script>
</body>
</html>
