<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Object</title>
</head>
<body>
    <script>
        employee=new Object() // other method to create new object
        employee.id=101
        employee.name="Moinuddin"
        employee.mobile=9586938282
        employee.address="Dholka"
        document.write('<br>'+employee.mobile)
        var obj={
            fullname:{
                username:{
                    fname:"Moinuddin",
                    lname:"Momin"

                }
            }
        }
        // document.write('<br>'+obj.fullname.username.lname)
        if(obj.fullname.username.lname=="Momin"){
            document.write('<br>Yes Get it')
        }else{
            document.write('<br>ops Not Getit')
        }
       
        var x={1:"a",
            2:"b",
            3:"c"
        }
        var y={
            "x":1,
            "y":2,
            "z":3

        }
        var z={
            name:"moin",
            city:"dholka",
            age:21
        }
        Object.assign(x,y,z) // use for concate 2 object 
        // Object.assign({},x,y,z) // Those Method are use for concate 2 object 

        document.write('<br>'+x)
        document.write('<br>'+x.z)
        document.write('<br>'+x.age)
        document.write('<br>'+x.city)
        document.write('<br>'+( Object.keys(x)))
        document.write('<br>'+Object.values(x))
        
        document.write('<br>'+Object.keys(x).length)
        var k=Object.keys(x)
        document.write('<br>'+k)
        k.forEach(e => {
            // document.write('<br>'+"keys = "+e+" value = "+x.e)
            // document.write('<br>'+x["e"])
            document.write('<br>'+e+x.e)
        });
        for (let index = 0; index < k.length; index++) {
            // const element = array[index];
            document.write('<br>'+x.k[index])
            
        }
        


       

    </script>
</body>
</html>
