<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <select name="ord" id="ord" onchange="Sort_data(this)">
        <option value="">select</option>
        <option value="asd">Ascending</option>
        <option value="dsc">descending</option>
    </select><br><br>
    <table border="2">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Age</th>

            </tr>
        </thead>
        <tbody id="t_data">
            
        </tbody>
    </table>

    <script>
        let a = [
            {
                id:101,
                name:"Test",
                age:26
            },
            {
                id:102,
                name:"Abc",
                age:24
            },
            {
                id:103,
                name:"Pqr",
                age:28
            },
            {
                id:104,
                name:"Afdgdg",
                age:18
            },
            {
                id:105,
                name:"pqrt",
                age:24
            }
        ]
        let all_data=""

        for (const element of a) {
            all_data+=`
            <tr>
                <td>${element.id}</td>
                <td>${element.name}</td>
                <td>${element.age}</td>
            </tr>`
        }
        document.getElementById("t_data").innerHTML=all_data

    
        let Sort_data=(k)=>{
           
           if(k.value=="asd"){
            a.sort((a,b)=> a.age-b.age)
            
           }
           else if(k.value=="dsc"){
            a.sort((a,b)=> b.age-a.age)
            
           }
           else{
            a.sort((a,b)=>a.id-b.id)
           }
           a
           all_data=""
           for(const mm of a) {
            all_data+=`
                <tr>
                <td>${mm.id}</td>
                <td>${mm.name}</td>
                <td>${mm.age}</td>
                </tr>`}
           document.getElementById("t_data").innerHTML=all_data
        }
    </script>
</body>
</html>
