<html lang="en">
<head>

<body>

    <!-- +,-,/,%,**,++,--,= -->
    <script>
        var a=2
        var b=20
        document.write('<br>Addition is '+(a+b))
        document.write('<br>power is '+a**3) // last ma jetli value apso etlu into thase
        var a=4
        a++ // posefix
        
        document.write('<br>increment='+a);
        var x=20
        var y=x++ // posefix
        var z=++x // prefix
        document.write('<br>x normal value ='+x)
        document.write('<br> x postfix='+y)
        document.write('<br> x prefix='+z)

        a=20
        var b=4
        document.write('<br>Reminder(Modulo) ='+(a%2)) // ses apse
        document.write('<br>Devide=='+(a/b))

        document.write('<br>Not Equal=='+(a==b))
        document.write('<br>Not Equal=='+(a!=b))
        document.write('<br>Power = '+(b**2))
        document.write('<br>Cube = '+(b**3))
        document.write('<br>Equal = '+(a===b))
        document.write('<br>Equal (Not)= '+(a!==b))

        var a=20
        var b=4
        var x=a%=b // its call ShortHand Operator
        document.write('<br>Modulo = '+x)
        var y=a+=b
        document.write('<br>Addition = '+y)
        var z=a-=b
        document.write('<br>Minus = '+z)
        var w=a/=b
        document.write('<br>Devide = '+w)




        

        




        
        
        
    </script>
    
</body>
